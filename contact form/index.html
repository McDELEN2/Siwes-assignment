<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Contact form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="contact-form">
      <h1>Contact Us</h1>
      <form>
        <!--field for first and last name-->
        <div class="name-fields">
        <div class="form-group">
          <label for="first-name">First Name</label>
          <input id="first-name" type="text" name="first-name">
        </div>
        <div class="form-group">
          <label for="last-name">Last Name</label>
          <input id="last-name" type="text" name="last-name">
        </div>
        </div>
        
        <!--field for email-->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email">
        </div>
        
        <!--field for query-->
        <div class="form-group">
          <label>Query Type</label>

          <div class="query-options">
          <!--first radio option-->
          <div class="radio-option">
          <input type="radio" name="query-type" value="general" id="general-enquiry">
          <label for="general-enquiry">General Enquiry</label>
        </div>
        
        <!--second radio option-->
        <div class="radio-option">
          <input type="radio" name="query-type" value="support" id="support-request">
          <label for="support-request">Support Request</label>
        </div>
        </div>
        </div>
        
        <!--Message area-->
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" cols="5" rows="5"></textarea>
        </div>
        
        <!--Checkbox-->
        <div class="form-group consent">
          <input type="checkbox" id="consent" name="consent">
          <label for="consent">I consent to being contacted by the team</label>
        </div>
        
        <!--The Submit button-->
        <div class="form-group submit">
          <button type="submit">Submit</button>
        </div>
      </form>
    </section>
    
  </main>

  <script src="script.js"></script>
</body>
</html>
